<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="600" height="460" role="img" aria-label="Дашборд контроля качества и KPI">
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7941D"/>
      <stop offset="1" stop-color="#F04E23"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF7F1"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#F04E23" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="600" height="460" rx="24" fill="url(#bg)"/>

  <!-- Карточка дашборда -->
  <g filter="url(#sh)">
    <rect x="48" y="48" width="504" height="364" rx="18" fill="#FFFFFF" stroke="#EFE7E0"/>
  </g>

  <!-- Шапка карточки -->
  <circle cx="76" cy="80" r="6" fill="#F26522"/>
  <circle cx="96" cy="80" r="6" fill="#F7A81B"/>
  <rect x="120" y="74" width="130" height="12" rx="6" fill="#EFE7E0"/>
  <rect x="430" y="70" width="90" height="20" rx="10" fill="#FFF0E6"/>
  <text x="475" y="85" font-family="Inter, Arial" font-size="12" font-weight="700" fill="#F26522" text-anchor="middle">KPI 92%</text>

  <!-- Столбчатая диаграмма -->
  <g>
    <rect x="80"  y="250" width="34" height="90"  rx="6" fill="#F0DCCF"/>
    <rect x="128" y="210" width="34" height="130" rx="6" fill="#F7A81B"/>
    <rect x="176" y="170" width="34" height="170" rx="6" fill="url(#or)"/>
    <rect x="224" y="220" width="34" height="120" rx="6" fill="#F0DCCF"/>
    <rect x="272" y="150" width="34" height="190" rx="6" fill="url(#or)"/>
  </g>
  <line x1="72" y1="340" x2="320" y2="340" stroke="#EFE7E0" stroke-width="2"/>

  <!-- Линия роста -->
  <polyline points="356,300 396,270 436,285 476,220 516,180"
            fill="none" stroke="#F26522" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FFFFFF" stroke="#F26522" stroke-width="3">
    <circle cx="356" cy="300" r="5"/><circle cx="396" cy="270" r="5"/>
    <circle cx="436" cy="285" r="5"/><circle cx="476" cy="220" r="5"/>
    <circle cx="516" cy="180" r="6"/>
  </g>

  <!-- Чек-лист качества -->
  <g transform="translate(356,120)">
    <rect x="0" y="-8" width="20" height="20" rx="5" fill="url(#or)"/>
    <path d="M4 2 L8 6 L16 -3" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="32" y="-4" width="120" height="10" rx="5" fill="#EFE7E0"/>
  </g>
  <g transform="translate(356,150)">
    <rect x="0" y="-8" width="20" height="20" rx="5" fill="url(#or)"/>
    <path d="M4 2 L8 6 L16 -3" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="32" y="-4" width="96" height="10" rx="5" fill="#EFE7E0"/>
  </g>
</svg>
